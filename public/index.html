<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: 홈 화면에 추가하면 앱처럼 전체 화면으로 열린다 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFF9EE" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      /* 한국어는 단어(어절) 단위로 줄바꿈하고, 너무 긴 이메일·주소만 끊는다. 마지막 줄에 한두 글자만 남지 않게 한다. */
      #root {
        word-break: keep-all;
        overflow-wrap: break-word;
        text-wrap: pretty;
      }
      /* 터치 효과: 버튼을 누르는 동안 살짝 눌리는 느낌 */
      #root [role='button'], #root [role='tab'], #root [role='radio'], #root [role='switch'] {
        transition: transform 0.12s ease, opacity 0.12s ease;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
      }
      #root [role='button']:active, #root [role='tab']:active, #root [role='radio']:active {
        transform: scale(0.95);
        opacity: 0.8;
      }
      @media (prefers-reduced-motion: reduce) {
        #root [role='button']:active, #root [role='tab']:active, #root [role='radio']:active { transform: none; }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
