name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # ponytail: Windows에서 만든 lock 파일은 Linux 전용 선택 패키지가 빠져 npm ci가 실패한다. 재현성이 꼭 필요해지면 lock을 Linux에서 다시 만든다.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
